// ErrorBoundary: Zeigt Fehler statt schwarzem Bildschirm
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = {error:null}; }
  static getDerivedStateFromError(e) { return {error:e}; }
  render() {
    if (this.state.error) {
      return (
        <div style={{padding:20,background:"#FEE2E2",margin:12,borderRadius:12,border:"1px solid #EF4444"}}>
          <h3 style={{color:"#B91C1C",margin:"0 0 8px"}}>⚠️ Fehler gefunden!</h3>
          <pre style={{fontSize:11,color:"#7F1D1D",whiteSpace:"pre-wrap",margin:0}}>
            {this.state.error.toString()}
          </pre>
          <button onClick={()=>this.setState({error:null})} 
            style={{marginTop:10,padding:"6px 12px",background:"#EF4444",color:"#fff",border:"none",borderRadius:6,cursor:"pointer"}}>
            Zurück
          </button>
        </div>
      );
    }
    return this.props.children;
  }
}

  "Asien":     {e:"🌏",c:"#7C3AED",mapBg:"#F0EBD8",center:[90,38],  scale:250},
  "Ozeanien":  {e:"🌏",c:"#0891B2",mapBg:"#F0EBD8",center:[150,-25],scale:430},
};

// Nord- und Mittelamerika werden unter "Nord- und Zentralamerika" zusammengefasst
const KONTINENT_GRUPPEN = {
  "Nord- und Zentralamerika": ["Nordamerika","Mittelamerika"],
};

function getKontinentLaender(anzeigeName) {
  const rohNamen = KONTINENT_GRUPPEN[anzeigeName] || [anzeigeName];
  return LAENDER.filter(l => rohNamen.includes(l.k));
}

const GEO = "https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json";

// Regionale Fallbacks für kleine Kontinente
const REGION_FALLBACK = {
  "Nord- und Zentralamerika": ["Südamerika"],
  "Ozeanien": ["Asien","Südamerika"],
};

function getRegionalPool(anzeigeName, mindest) {
  const haupt = getKontinentLaender(anzeigeName);
  if (haupt.length >= mindest) return haupt;
  let pool = [...haupt];
  for (const fb of (REGION_FALLBACK[anzeigeName] || [])) {
    if (pool.length >= mindest) break;
    pool = [...pool, ...getKontinentLaender(fb).filter(l => !pool.find(x => x.iso2 === l.iso2))];
  }
  if (pool.length < mindest) {
    pool = [...pool, ...LAENDER.filter(l => !pool.find(x => x.iso2 === l.iso2))];
  }
  return pool;
}
function getMC(r,pool,f){
  const w=sh(pool.filter(p=>p[f]!==r[f])).slice(0,3).map(p=>p[f]);
  return sh([r[f],...w]);
}
function fmtN(n){
  if(n>=1e9)return (n/1e9).toFixed(1)+" Mrd.";
  if(n>=1e6)return (n/1e6).toFixed(1)+" Mio.";
  return n.toLocaleString("de-DE");
}
function mrFarbe(t){return t==="Frei"?"#15803D":t==="Teilweise frei"?"#D97706":"#DC2626";}
function mrBg(t){return t==="Frei"?"#DCFCE7":t==="Teilweise frei"?"#FEF3C7":"#FEE2E2";}

// ─── KARTE ───────────────────────────────────────────────────────────────────
function Karte({kontinent,laender,fp,onKlick,aktivIso}){
  const ref=useRef(null);
  const [geoData,setGeoData]=useState(null);  // einmal laden, nicht bei jedem Klick
  const [laden,setLaden]=useState(true);
  const [fehler,setFehler]=useState(false);
  const cfg=KFIG[kontinent];
  const isoSet=useMemo(()=>new Set(laender.map(l=>l.iso2)),[laender]);

  // Effekt 1: GeoJSON NUR EINMAL laden (kein Re-fetch bei Klicks)
  useEffect(()=>{
    setLaden(true); setFehler(false);
    fetch(GEO)
      .then(r=>{if(!r.ok)throw 0;return r.json();})
      .then(topo=>{
        setGeoData(topojson.feature(topo,topo.objects.countries));
        setLaden(false);
      })
      .catch(()=>{setFehler(true);setLaden(false);});
  },[]);  // Leeres Array: nur einmal beim Mounten

  // Effekt 2: Karte NEU ZEICHNEN wenn Daten ändern (kein Fetch, kein schwarzer Bildschirm)
  useEffect(()=>{
    if(!geoData||!ref.current)return;
    const el=ref.current;
    const W=el.clientWidth||800, H=el.clientHeight||380;
    const svg=d3.select(el);
    svg.selectAll("*").remove();

    const defs=svg.append("defs");
    const glow=defs.append("filter").attr("id","glow").attr("x","-30%").attr("y","-30%").attr("width","160%").attr("height","160%");
    glow.append("feGaussianBlur").attr("stdDeviation","3").attr("result","blur");
    const feMerge=glow.append("feMerge");
    feMerge.append("feMergeNode").attr("in","blur");
    feMerge.append("feMergeNode").attr("in","SourceGraphic");

    const proj=d3.geoMercator().center(cfg.center).scale(cfg.scale).translate([W/2,H/2]);

    const kontinentFeatures=geoData.features.filter(ft=>isoSet.has(N2I[+ft.id]));
    const ZOOM_AUSSCHLUSS={"Europa":new Set(["RU"])};
    const ausschluss=ZOOM_AUSSCHLUSS[kontinent]||new Set();
    const fitFeatures=kontinentFeatures.filter(ft=>!ausschluss.has(N2I[+ft.id]));

    if(kontinent==="Europa"){
      // Zoom direkt berechnen: Europa von ~22°W bis 45°E, 38°N bis 72°N
      const lonRange = 67 * Math.PI / 180;
      const euroScale = Math.round((W - 60) / lonRange);
      proj.scale(euroScale).center([11, 57]).translate([W/2, H/2]);
    } else if(kontinent==="Nord- und Zentralamerika"){
      // Kanada-Nord abschneiden, Zentralamerika sichtbar: 120°W–60°W, 8°N–52°N
      const lonRange = 92 * Math.PI / 180;
      const amScale = Math.round((W - 60) / lonRange);
      proj.scale(amScale).center([-95, 38]).translate([W/2, H/2]);
    } else if(fitFeatures.length>0){
      try{ proj.fitExtent([[24,24],[W-24,H-24]],{type:"FeatureCollection",features:fitFeatures}); }
      catch(_){}
    }

    const path=d3.geoPath().projection(proj);
    const gs=iso=>fp[iso]||"locked";

    const getFill=(iso)=>{
      if(!iso||!isoSet.has(iso))return "#D8DECA";
      const s=gs(iso);
      return s==="unlocked"?"#22C55E":"#B8CDB5";
    };

    svg.append("rect").attr("width",W).attr("height",H).attr("fill",cfg.mapBg);
    const g=svg.append("g");

    g.selectAll("path")
      .data(geoData.features)
      .join("path")
      .attr("d",path)
      .attr("fill",ft=>getFill(N2I[+ft.id]))
      .attr("stroke",ft=>isoSet.has(N2I[+ft.id])?"#fff":"#94A3B8")
      .attr("stroke-width",ft=>isoSet.has(N2I[+ft.id])?0.8:0.3)
      .style("cursor",ft=>isoSet.has(N2I[+ft.id])?"pointer":"default")
      .on("mouseover",function(ev,ft){
        const iso=N2I[+ft.id];
        if(!isoSet.has(iso))return;
        const s=gs(iso);
        d3.select(this).attr("fill",s==="unlocked"?"#15803D":"#8AAF86");
      })
      .on("mouseout",function(ev,ft){
        const iso=N2I[+ft.id];
        d3.select(this).attr("fill",getFill(iso));
      })
      .on("click",function(ev,ft){
        const iso=N2I[+ft.id];
        if(!isoSet.has(iso))return;
        const land=laender.find(l=>l.iso2===iso);
        if(land)onKlick(land);
      });

    laender.forEach(land=>{
      if(gs(land.iso2)!=="unlocked")return;
      const ft=geoData.features.find(f=>N2I[+f.id]===land.iso2);
      if(!ft)return;
      try{
        const[cx,cy]=path.centroid(ft);
        if(!isNaN(cx)&&!isNaN(cy)){
          g.append("text").attr("x",cx).attr("y",cy)
            .text(land.land.length>10?land.land.split(" ")[0]:land.land)
            .attr("font-size","7px").attr("fill","#fff")
            .attr("text-anchor","middle").attr("dominant-baseline","middle")
            .attr("pointer-events","none")
            .style("text-shadow","0 0 3px #000,0 0 3px #000");
        }
      }catch(_){}
    });
  },[geoData,fp,laender,kontinent]);  // aktivIso NICHT hier – verhindert Neuzeichnen beim Klick

  return(
    <div style={{position:"relative",width:"100%",height:"100%",background:cfg.mapBg,borderRadius:8,overflow:"hidden"}}>
      <svg ref={ref} style={{width:"100%",height:"100%",display:"block"}}/>
      {laden&&<div style={{position:"absolute",top:0,left:0,right:0,bottom:0,display:"flex",alignItems:"center",justifyContent:"center",gap:8,color:"#64748B",fontSize:13}}>
        <div style={{width:18,height:18,border:"2px solid #CBD5E1",borderTopColor:cfg.c,borderRadius:"50%",animation:"spin 0.8s linear infinite"}}/>
        Karte wird geladen...
      </div>}
      {fehler&&<div style={{position:"absolute",top:0,left:0,right:0,bottom:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:6,color:"#94A3B8",padding:20,textAlign:"center"}}>
        <span style={{fontSize:28}}>🗺️</span>
        <span style={{fontSize:13}}>Karte konnte nicht geladen werden</span>
      </div>}
{/* Legende */}
      <div style={{position:"absolute",bottom:8,right:8,display:"flex",gap:8,fontSize:10,
        background:"rgba(255,255,255,0.9)",padding:"4px 8px",borderRadius:6,
        border:"1px solid #E2E8F0"}}>
        {[{c:"#B8CDB5",l:"offen"},{c:"#22C55E",l:"gelöst"},{c:"#fff",l:"ausgewählt",border:true}].map(({c,l,border})=>(
          <span key={l} style={{display:"flex",alignItems:"center",gap:4,color:"#475569"}}>
            <span style={{width:8,height:8,borderRadius:2,background:c,display:"inline-block",border:border?"1.5px solid #94A3B8":"none"}}/>
            {l}
          </span>
        ))}
      </div>
    </div>
  );
}

// ─── QUIZ PANEL (inline, kein Modal/fixed – funktioniert auf iOS) ───────────────
function QuizPanel({land, laender, fp, setFP, onFertig, onAbbruch, onVersuch}){
  // Pool: erst Sub-Region, dann Kontinent, dann alles – je nachdem was ≥8 Einträge hat
  const pool = (() => {
    const sr = land.sr || land.k;
    const subR = LAENDER.filter(l=>l.sr===sr);
    if(subR.length>=6) return subR;
    // Verwandte Regionen zusammenfassen
    const related = {
      "Amerika-Nord":["Amerika-Mitte"],"Amerika-Mitte":["Amerika-Nord","Amerika-Sued"],
      "Amerika-Sued":["Amerika-Mitte"],"Europa-Sued":["Europa-NordWest","Europa-Balkan"],
      "Europa-Balkan":["Europa-Sued","Europa-OstMitte"],"Afrika-Sued":["Afrika-Ost","Afrika-West"],
      "MENA-Golf":["MENA-Levante","Afrika-Nord"],"Ozeanien":["Asien-SO"],
      "Asien-Zentral":["Asien-Ost","Asien-Sued"],
    };
    const extras = (related[sr]||[]).flatMap(r=>LAENDER.filter(l=>l.sr===r));
    const combined = [...new Map([...subR,...extras].map(l=>[l.iso2,l])).values()];
    if(combined.length>=6) return combined;
    // Fallback: ganzer Kontinent
    const cont = LAENDER.filter(l=>l.k===land.k);
    return cont.length>=4 ? cont : LAENDER;
  })();
  const [optsLand] = useState(()=>{
    const w=pool.filter(l=>l.land!==land.land).sort(()=>Math.random()-.5).slice(0,3).map(l=>l.land);
    return [land.land,...w].sort(()=>Math.random()-.5);
  });
  const [optsHs] = useState(()=>{
    const w=pool.filter(l=>l.hs!==land.hs).sort(()=>Math.random()-.5).slice(0,3).map(l=>l.hs);
    return [land.hs,...w].sort(()=>Math.random()-.5);
  });
  const [schritt, setSchritt] = useState(fp[land.iso2]==="step2"?2:1);
  const [gewaehlt, setGewaehlt] = useState(null);
  const [feedback, setFeedback] = useState(null);

  const opts    = schritt===1 ? optsLand : optsHs;
  const richtig = schritt===1 ? land.land : land.hs;

  function waehle(opt){
    if(gewaehlt) return;
    setGewaehlt(opt);
    const korrekt = opt===richtig;
    if(onVersuch) onVersuch(korrekt, land.iso2, schritt);
    if(korrekt){
      setFeedback("richtig");
      if(schritt===1){
        setFP(land.iso2,"step2");
        setTimeout(()=>{setSchritt(2);setGewaehlt(null);setFeedback(null);},900);
      } else {
        setFP(land.iso2,"unlocked");
        setTimeout(()=>onFertig(land),900);
      }
    } else {
      setFeedback("falsch");
      setTimeout(onAbbruch,1600);
    }
  }

  return(
    <div style={{padding:"28px 24px"}}>

      {/* Header */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
        <span style={{fontSize:11,fontWeight:700,color:"#94A3B8",letterSpacing:"0.1em",textTransform:"uppercase"}}>
          Frage {schritt} von 2
        </span>
        <button onClick={onAbbruch}
          style={{background:"none",border:"none",color:"#94A3B8",fontSize:13,cursor:"pointer",
            display:"flex",alignItems:"center",gap:4}}>
          schließen ✕
        </button>
      </div>

      {/* Frage */}
      <h2 style={{fontSize:24,fontWeight:900,color:"#0F172A",margin:"0 0 24px",lineHeight:1.2}}>
        {schritt===1 ? "Welches Land ist das?" : "Was ist die Hauptstadt von "+land.land+"?"}
      </h2>

      {/* 2×2 Antwort-Grid */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:20}}>
        {opts.map(opt=>{
          let bg="#F8FAFC", bc="#E2E8F0", tc="#1E293B";
          if(gewaehlt){
            if(opt===gewaehlt){
              if(opt===richtig){bg="#DCFCE7";bc="#22C55E";tc="#15803D";}
              else{bg="#FEE2E2";bc="#EF4444";tc="#B91C1C";}
            }
          }
          return(
            <button key={opt} onClick={()=>waehle(opt)}
              style={{padding:"14px 12px",borderRadius:10,fontSize:14,fontWeight:500,
                textAlign:"left",background:bg,border:"1.5px solid "+bc,color:tc,
                cursor:gewaehlt?"default":"pointer",transition:"all 0.15s",lineHeight:1.3}}
              onMouseEnter={e=>{if(!gewaehlt){e.currentTarget.style.background="#F1F5F9";e.currentTarget.style.borderColor="#CBD5E1";}}}
              onMouseLeave={e=>{if(!gewaehlt){e.currentTarget.style.background=bg;e.currentTarget.style.borderColor=bc;}}}>
              {opt}
            </button>
          );
        })}
      </div>

      {/* Feedback */}
      {feedback&&(
        <div style={{textAlign:"center",padding:"10px 0"}}>
          {feedback==="richtig" ? (
            <span style={{color:"#15803D",fontWeight:600,fontSize:14}}>
              {schritt===1?"✓ Richtig! Jetzt die Hauptstadt…":"🏆 Perfekt! Profil freigeschaltet!"}
            </span>
          ):(
            <div>
              <div style={{color:"#DC2626",fontWeight:600,fontSize:14,marginBottom:12}}>Leider falsch! 😔</div>
              <button onClick={onAbbruch}
                style={{background:"#F1F5F9",border:"none",borderRadius:8,
                  padding:"8px 16px",fontSize:13,fontWeight:600,color:"#475569",cursor:"pointer"}}>
                🗺️ Zurück zur Karte
              </button>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

        </Cell>
        <Cell label="Glücklicher Planet (HPI 2021)">
          {land.hpi&&land.hpi.r
            ? "Rang "+land.hpi.r+" · Score "+land.hpi.s

                <td style={{whiteSpace:"nowrap"}}>{fmtN(l.bev)}</td>
                <td>
                  <span className="badge" style={{background:mrb,color:mrc,fontSize:10}}>
                    {l.mr.s}/100
                  </span>
                </td>
                <td style={{whiteSpace:"nowrap"}}>Rang #{l.pf.r}{l.pf.p?<span style={{color:"#94A3B8",fontSize:10}}> · {l.pf.p}P</span>:null}</td>
                <td>
                  <div style={{display:"flex",flexWrap:"wrap",gap:2}}>
                    {l.gi.st.slice(0,2).map(s=>(
                      <span key={s} className="chip" style={{fontSize:10}}>{s.split(" (")[0]}</span>
                    ))}
                    {l.gi.st.length>2&&<span style={{fontSize:10,color:"#94A3B8"}}>+{l.gi.st.length-2}</span>}
                  </div>
                </td>
                <td style={{maxWidth:160,color:"#475569"}}>
                  {hatLeitung?<span style={{fontSize:13}}>{l.gi.lei}</span>:<span style={{color:"#CBD5E1"}}>nicht öffentlich</span>}
                </td>
                <td>
                  {hatBot
                    ?<div><div style={{fontWeight:500,fontSize:13}}>{l.bot.n}</div>
                       <div style={{color:"#94A3B8",fontSize:10}}>{l.bot.ti!=="k.A."?l.bot.ti:""}</div></div>
                    :<span style={{color:"#CBD5E1",fontSize:11}}>{l.bot.o}</span>}
                </td>
              
                <td style={{whiteSpace:"nowrap",fontSize:12}}>{l.epi&&l.epi.r?<span title={"Score "+l.epi.s}>#{l.epi.r}</span>:<span style={{color:"#CBD5E1"}}>–</span>}</td>
                <td style={{whiteSpace:"nowrap",fontSize:12}}>{l.hpi&&l.hpi.r?<span title={"Score "+l.hpi.s}>#{l.hpi.r}</span>:<span style={{color:"#CBD5E1"}}>–</span>}</td>
                <td>{l.gs!==l.hs?<span style={{color:"#475569"}}>{l.gs}</span>:<span style={{color:"#CBD5E1"}}>–</span>}</td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

function Footer(){
  return(
    <div style={{textAlign:"center",padding:"10px 16px",fontSize:10,color:"#0F172A",
      borderTop:"1px solid #F1F5F9",background:"#fff",userSelect:"none"}}>
      Lizenz: CC BY-SA-NC &nbsp;·&nbsp; Urheber: Klaus J. Buß &nbsp;·&nbsp; Daten: Freedom House 2025, RSF 2025, Goethe-Institut, Weltbank 2023
    </div>
  );
}
function KView({kontinent, laender, fp, setFP, setAllFP, resetFP, onBack}){
  const [aktiv,  setAktiv]  = useState(null);
  const [profil, setProfil] = useState(null);
  const [stats,  setStats]  = useState({richtig:0, versuche:0, perfekt:0});
  // Ref: welche Schritte wurden bereits versucht? Key = "iso2_schritt"
  const erstversuchRef = useRef({});

  const frei = laender.filter(l=>fp[l.iso2]==="unlocked").length;
  const pct  = Math.round(frei/laender.length*100);
  const cfg  = KFIG[kontinent]||{c:"#6366F1",e:"🌍"};
  const HEADER_H = 52;

  function klick(land){
    const s = fp[land.iso2]||"locked";
    if(s==="unlocked"){ setAktiv(null); setProfil(land); }
    else { setProfil(null); setAktiv(land); }
  }

  // onVersuch bekommt jetzt auch den Schritt (1 oder 2)
  function onVersuch(korrekt, iso2, schritt){
    setStats(s=>({
      ...s,
      versuche: s.versuche + 1,
      richtig:  korrekt ? s.richtig + 1 : s.richtig,
    }));
    const key = iso2 + "_" + schritt;
    const erster = !erstversuchRef.current[key];
    erstversuchRef.current[key] = true; // als versucht markieren
    // Sofort +1 wenn erster Versuch und richtig
    if(korrekt && erster){
      setStats(s=>({...s, perfekt: s.perfekt + 1}));
    }
  }

  function onFertig(land){
    setAktiv(null);
    setTimeout(()=>setProfil(land),100);
  }

  return(
    <div style={{minHeight:"100vh",background:"#F5F4ED",fontFamily:"Georgia,'Times New Roman',serif"}}>

      {/* Header */}
      <div style={{position:"sticky",top:0,zIndex:20,background:"#fff",height:HEADER_H,
        borderBottom:"1px solid #E2E8F0",display:"flex",alignItems:"center",
        padding:"0 24px",gap:12,boxShadow:"0 1px 3px rgba(0,0,0,0.06)"}}>
        <button onClick={()=>{setAktiv(null);setProfil(null);onBack();}}
          style={{background:"none",border:"none",color:"#64748B",fontSize:13,
            cursor:"pointer",display:"flex",alignItems:"center",gap:4,padding:"4px 8px",borderRadius:6}}>
          ← Zurück
        </button>
        <div style={{width:1,height:20,background:"#E2E8F0"}}/>
        <span style={{fontSize:18}}>{cfg.e}</span>
        <h1 style={{fontSize:16,fontWeight:700,color:"#0F172A",margin:0}}>{kontinent}</h1>
        <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:12}}>
          <span style={{fontSize:12,fontWeight:600,color:"#64748B"}}>{frei}/{laender.length} freigeschaltet</span>
          <div style={{width:90,height:4,background:"#E2E8F0",borderRadius:2}}>
            <div style={{width:pct+"%",height:4,background:cfg.c,borderRadius:2,transition:"width 0.4s"}}/>
          </div>
          {frei>0&&(
            <button onClick={()=>{resetFP();setAktiv(null);setProfil(null);}}
              style={{marginLeft:4,padding:"5px 12px",borderRadius:8,
                border:"2px solid #DC2626",background:"#FEF2F2",
                fontSize:12,fontWeight:700,color:"#DC2626",cursor:"pointer",
                whiteSpace:"nowrap"}}
              onMouseEnter={e=>{e.currentTarget.style.background="#DC2626";e.currentTarget.style.color="#fff";}}
              onMouseLeave={e=>{e.currentTarget.style.background="#FEF2F2";e.currentTarget.style.color="#DC2626";}}>
              ↺ Zurücksetzen
            </button>
          )}
          {frei<laender.length&&(
            <button onClick={()=>setAllFP(laender.map(l=>l.iso2),"unlocked")}
              style={{marginLeft:12,padding:"5px 12px",borderRadius:8,
                border:"1px solid #E2E8F0",background:"#F8FAFC",
                fontSize:12,fontWeight:600,color:"#475569",cursor:"pointer",
                whiteSpace:"nowrap"}}
              onMouseEnter={e=>{e.currentTarget.style.background="#F1F5F9";}}
              onMouseLeave={e=>{e.currentTarget.style.background="#F8FAFC";}}>
              Keine Lust auf Raten? Alles anzeigen
            </button>
          )}
        </div>
      </div>

      {/* Inhalt */}
      <div style={{maxWidth:1200,margin:"0 auto",padding:"20px 24px"}}>

        {/* Stats-Zeile */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,marginBottom:20}}>
          {[
            {label:"Gelöste Länder",   val:frei+"/"+laender.length},
            {label:"Richtige Antworten", val:stats.richtig},
            {label:"Versuche Gesamt",    val:stats.versuche},
            {label:"Beim ersten Versuch perfekt", val:stats.perfekt},
          ].map(({label,val})=>(
            <div key={label} style={{background:"#fff",borderRadius:12,border:"1px solid #E2E8F0",
              padding:"14px 18px",boxShadow:"0 1px 3px rgba(0,0,0,0.04)"}}>
              <div style={{fontSize:10,fontWeight:700,color:"#64748B",letterSpacing:"0.08em",
                textTransform:"uppercase",marginBottom:6}}>{label}</div>
              <div style={{fontSize:26,fontWeight:900,color:"#0F172A"}}>{val}</div>
            </div>
          ))}
        </div>

        {/* Karte + Sidebar */}
        <div className="kview-split" style={{display:"flex",gap:16,alignItems:"flex-start",marginBottom:24}}>

          {/* Karte */}
          <div className="kview-map"
            style={{flex:"0 0 58%",minWidth:0,borderRadius:16,overflow:"hidden",
              height:"calc(100vh - "+HEADER_H+"px - 156px)"}}>
            <Karte kontinent={kontinent} laender={laender} fp={fp} onKlick={klick}/>
          </div>

          {/* Sidebar */}
          <div className="kview-profil"
            style={{flex:1,minWidth:280,background:"#fff",borderRadius:16,
              border:"1px solid #E2E8F0",overflow:"hidden",
              maxHeight:"calc(100vh - "+HEADER_H+"px - 156px)",overflowY:"auto",
              boxShadow:"0 1px 6px rgba(0,0,0,0.06)"}}>
            {aktiv ? (
              <ErrorBoundary>
                <QuizPanel key={aktiv.iso2} land={aktiv} laender={laender}
                  fp={fp} setFP={setFP}
                  onFertig={onFertig}
                  onAbbruch={()=>setAktiv(null)}
                  onVersuch={onVersuch}/>
              </ErrorBoundary>
            ) : profil ? (
              <ProfilInline land={profil} onClose={()=>setProfil(null)}/>
            ) : (
              <div style={{padding:"32px 24px",textAlign:"center",color:"#94A3B8"}}>
                <div style={{fontSize:40,marginBottom:14}}>🗺️</div>
                <div style={{fontSize:17,fontWeight:700,color:"#475569",marginBottom:8}}>
                  Wähle ein Land auf der Karte
                </div>
                <div style={{fontSize:13,lineHeight:1.5}}>
                  Klicke ein blaues Land an,<br/>um das Quiz zu starten.
                </div>
              </div>

            )}
          </div>
        </div>

        {/* Tabelle */}
        {frei>0&&(
          <div>
            <h2 style={{fontSize:20,fontWeight:800,color:"#0F172A",margin:"0 0 4px"}}>Erratene Länder im Überblick</h2>
            <p style={{fontSize:13,color:"#94A3B8",margin:"0 0 14px"}}>
              Die Tabelle zeigt nur Länder, die du im Quiz bereits vollständig gelöst hast. So bleiben die übrigen Hauptstädte und Profile verdeckt.
            </p>
            <div style={{background:"#fff",borderRadius:12,border:"1px solid #E2E8F0",
              overflow:"hidden",boxShadow:"0 1px 3px rgba(0,0,0,0.04)"}}>
              <div style={{overflowX:"auto"}}>
                <LaenderTabelle laender={laender} fp={fp} onZeile={l=>{setAktiv(null);setProfil(l);}}/>
              </div>
            </div>
          </div>
        )}

      </div>
      <Footer/>
    </div>
  );
}


function Start({onWaehlen, fp}){
  const freiGesamt = Object.values(fp).filter(v=>v==="unlocked").length;
  const offenGesamt = Object.values(fp).filter(v=>v==="step2").length;
  const mitGI = LAENDER.filter(l=>l.gi.st.length>0).length;

  return(
    <div style={{minHeight:"100vh",background:"#F5F4ED",fontFamily:"Georgia,'Times New Roman',serif"}}>

      {/* ── Header ── */}
      <div style={{background:"#fff",borderBottom:"1px solid #E2E8F0",
        padding:"0 32px",height:56,display:"flex",alignItems:"center",
        position:"sticky",top:0,zIndex:30,boxShadow:"0 1px 3px rgba(0,0,0,0.06)"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,flex:1}}>
          <span style={{fontSize:22}}>🌐</span>
          <div>
            <div style={{fontWeight:800,fontSize:15,color:"#0F172A",lineHeight:1}}>Wir in der Welt</div>
            <div style={{fontSize:11,color:"#94A3B8",lineHeight:1.2}}>Länder · Hauptstädte · Daten</div>
          </div>
        </div>
        {freiGesamt>0&&(
          <div style={{display:"flex",alignItems:"center",gap:16}}>
            <div style={{textAlign:"right"}}>
              <div style={{fontSize:10,fontWeight:700,color:"#64748B",letterSpacing:"0.08em",textTransform:"uppercase"}}>Fortschritt</div>
              <div style={{fontSize:15,fontWeight:700,color:"#0F172A"}}>{freiGesamt} / {LAENDER.length} Länder</div>
            </div>
            <button onClick={()=>window.location.reload()}
              style={{padding:"6px 14px",borderRadius:8,border:"1px solid #E2E8F0",
                background:"#fff",fontSize:13,fontWeight:500,color:"#475569",cursor:"pointer"}}>
              Zurücksetzen
            </button>
          </div>
        )}
      </div>

      {/* ── Inhalt ── */}
      <div style={{maxWidth:1100,margin:"0 auto",padding:"40px 32px"}}>

        {/* Titel */}
        <h1 style={{fontSize:36,fontWeight:900,color:"#0F172A",letterSpacing:"-1px",margin:"0 0 12px"}}>
          Wo liegt was auf der{" "}
          <span style={{color:"#0D9488"}}>Weltkarte</span>?
        </h1>
        <p style={{fontSize:15,color:"#475569",maxWidth:680,lineHeight:1.6,margin:"0 0 40px"}}>
          Wähle einen Kontinent und klicke ein Land auf der Karte an. Erkenne das Land, dann seine Hauptstadt — und erfahre danach mehr über Bevölkerung, politisches System, Pressefreiheit, Menschenrechte und Nachhaltigkeit sowie die deutsche Präsenz vor Ort. Zum Quiz sind alle Länder mit Goethe-Präsenz anwählbar.
        </p>

        {/* Kontinent wählen */}
        <div style={{marginBottom:32}}>
          <h2 style={{fontSize:20,fontWeight:800,color:"#0F172A",margin:"0 0 4px"}}>Kontinent wählen</h2>
          <p style={{fontSize:13,color:"#94A3B8",margin:"0 0 16px"}}>
            Alle Kontinente sind spielbar. Klicke einen an, um die Karte zu öffnen.
          </p>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:12}}>
            {Object.entries(KFIG).map(([name,cfg])=>{
              const l = getKontinentLaender(name);
              const fr = l.filter(x=>fp[x.iso2]==="unlocked").length;
              const pct = Math.round(fr/l.length*100);
              const aktiv = fr>0;
              return(
                <button key={name} onClick={()=>onWaehlen(name)}
                  style={{textAlign:"left",padding:"16px",borderRadius:12,
                    border:"1px solid "+(aktiv?cfg.c+"55":"#E2E8F0"),
                    background:aktiv?cfg.c+"11":"#fff",
                    boxShadow:"0 1px 3px rgba(0,0,0,0.06)",
                    cursor:"pointer",transition:"all 0.15s"}}
                  onMouseEnter={e=>{e.currentTarget.style.transform="translateY(-2px)";e.currentTarget.style.boxShadow="0 4px 12px rgba(0,0,0,0.12)";}}
                  onMouseLeave={e=>{e.currentTarget.style.transform="none";e.currentTarget.style.boxShadow="0 1px 3px rgba(0,0,0,0.06)";}}>
                  <div style={{fontSize:24,marginBottom:6}}>{cfg.e}</div>
                  <div style={{fontWeight:700,fontSize:13,color:"#0F172A",marginBottom:2}}>{name}</div>
                  <div style={{fontSize:11,color:"#94A3B8",marginBottom:8}}>{l.length} Länder</div>
                  <div style={{background:"#E8ECF0",borderRadius:999,height:3}}>
                    <div style={{width:pct+"%",height:3,borderRadius:999,background:cfg.c,transition:"width 0.4s"}}/>
                  </div>
                  <div style={{fontSize:10,color:aktiv?cfg.c:"#94A3B8",marginTop:4,fontWeight:600}}>
                    {aktiv?fr+"/"+l.length+" freigeschaltet":"Spielbar"}
                  </div>
                </button>
              );
            })}
          </div>
        </div>

        {/* Stats */}
        {freiGesamt>0&&(
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))",gap:12,marginBottom:32}}>
            {[
              {label:"Gelöste Länder",val:freiGesamt+"/"+LAENDER.length},
              {label:"Hauptstadt noch offen",val:offenGesamt},
              {label:"Länder mit GI-Präsenz",val:mitGI},
              {label:"Noch zu entdecken",val:LAENDER.length-freiGesamt},
            ].map(({label,val})=>(
              <div key={label} style={{background:"#fff",borderRadius:12,
                border:"1px solid #E2E8F0",padding:"16px 20px",
                boxShadow:"0 1px 3px rgba(0,0,0,0.06)"}}>
                <div style={{fontSize:10,fontWeight:700,color:"#64748B",letterSpacing:"0.08em",
                  textTransform:"uppercase",marginBottom:6}}>{label}</div>
                <div style={{fontSize:28,fontWeight:900,color:"#0F172A"}}>{val}</div>
              </div>
            ))}
          </div>
        )}

      </div>
      <Footer/>
    </div>
  );
}


function App(){
  const [ansicht,setAnsicht]=useState("start");
  const [kontinent,setKontinent]=useState(null);
  const [fp,setFpState]=useState({});
  const setFP=useCallback((iso2,status)=>setFpState(p=>({...p,[iso2]:status})),[]);
  const setAllFP=useCallback((isos,status)=>setFpState(p=>{
    const n={...p}; isos.forEach(iso2=>n[iso2]=status); return n;
  }),[]);
  const resetFP=useCallback(()=>setFpState({}),[]);

  if(ansicht==="k"&&kontinent){
    return <KView kontinent={kontinent} laender={getKontinentLaender(kontinent)}
      fp={fp} setFP={setFP} setAllFP={setAllFP} resetFP={resetFP} onBack={()=>setAnsicht("start")}/>;
  }
  return <Start onWaehlen={n=>{setKontinent(n);setAnsicht("k");}} fp={fp}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
